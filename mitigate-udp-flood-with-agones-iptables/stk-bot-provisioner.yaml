# Karpenter v1 (NodePool + EC2NodeClass). Migrated from the removed alpha APIs.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: stkbot
spec:
  template:
    spec:
      requirements:
#      - key: karpenter.k8s.aws/instance-cpu
#        operator: Lt
#        values:
#        - "3"
#      - key: karpenter.k8s.aws/instance-category
#        operator: In
#        values:
#        - a
#        - c
#        - d
#        - m
#        - r
#        - t
      - key: kubernetes.io/arch
        operator: In
        values:
        - arm64
        - amd64
      - key: karpenter.sh/capacity-type
        operator: In
        values:
        - spot
        - on-demand
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: stkbot
      expireAfter: 720h
  limits:
    cpu: 20k
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 30s
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: stkbot
spec:
  # Replace with the IAM role attached to your Karpenter nodes.
  role: "KarpenterNodeRole-kts-usw2"
  amiSelectorTerms:
  - alias: al2023@latest
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 200Gi
        volumeType: gp3
        iops: 10000
        deleteOnTermination: true
        throughput: 125
  securityGroupSelectorTerms:
  - tags:
      karpenter.sh/discovery: kts-usw2
  subnetSelectorTerms:
  - tags:
      karpenter.sh/discovery: kts-usw2
