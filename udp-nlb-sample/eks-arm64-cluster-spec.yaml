apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: arm-us-west-2
  version: "1.33"
  region: us-west-2

kubernetesNetworkConfig:
  ipFamily: IPv4

vpc:
  clusterEndpoints:
    publicAccess: true
    privateAccess: true

iam:
  withOIDC: true

addons:
  # Omitting the version lets eksctl select the default add-on version for the
  # cluster's Kubernetes version. Pin explicit versions only when required.
  - name: vpc-cni
  - name: coredns
  - name: kube-proxy


managedNodeGroups:
  - instanceType: "c6g.xlarge"
    amiFamily: AmazonLinux2023
    name: arm-ng-1
    desiredCapacity: 1
    maxSize: 10
    minSize: 1
    tags:
      project: supertuxkart
    labels:
      project: supertuxkart
