# Karpenter v1 (NodePool + EC2NodeClass). Migrated from the removed alpha APIs
# (karpenter.sh/v1alpha5 Provisioner, karpenter.k8s.aws/v1alpha1 AWSNodeTemplate).
# See https://karpenter.sh/docs/concepts/nodepools/ and
# https://karpenter.sh/docs/concepts/nodeclasses/
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: lyra
spec:
  template:
    spec:
      requirements:
      - key: karpenter.k8s.aws/instance-cpu
        operator: In
        values:
        - "2"
      - key: karpenter.sh/capacity-type
        operator: In
        values:
        - on-demand
      - key: kubernetes.io/arch
        operator: In
        values:
        - arm64
        - amd64
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      expireAfter: 720h
  limits:
    cpu: 1000
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 30s
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  # Replace with the IAM role attached to your Karpenter nodes.
  role: "KarpenterNodeRole-lyra-usw2"
  amiSelectorTerms:
  - alias: al2023@latest
  subnetSelectorTerms:
  - tags:
      karpenter.sh/subnet/discovery: lyra-usw2-public
  securityGroupSelectorTerms:
  - tags:
      karpenter.sh/discovery: lyra-usw2
  userData: |
    MIME-Version: 1.0
    Content-Type: multipart/mixed; boundary="BOUNDARY"

    --BOUNDARY
    Content-Type: text/x-shellscript; charset="us-ascii"

    #!/bin/bash -x
    alloc_id=`aws ec2 describe-addresses --filters "Name=tag:game-name,Values=lyra" --query "Addresses[?AssociationId==null].AllocationId" --output text | awk '{print $1}'`
    if [ -z "$alloc_id" ]; then
      alloc_id=`aws ec2 allocate-address --tag-specifications 'ResourceType=elastic-ip,Tags=[{Key=game-name,Value=lyra},{Key=Name,Value=lyra}]' --query "AllocationId" --output text`
    fi
    TOKEN=`curl -s -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 21600"`
    instance_id=`curl -s -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/instance-id`
    # Karpenter v1 tags instances with karpenter.sh/nodepool/<name> (was provisioner-name in alpha).
    interface_id=`aws ec2 describe-network-interfaces --filters Name=tag:Name,Values=karpenter.sh/nodepool/lyra --query "NetworkInterfaces[?Attachment.InstanceId == '$instance_id'].NetworkInterfaceId" --output text`
    aws ec2 associate-address --network-interface-id $interface_id --allocation-id $alloc_id
    --BOUNDARY
